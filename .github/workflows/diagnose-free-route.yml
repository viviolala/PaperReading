name: Diagnose free cloud route

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-free-route.yml

permissions:
  contents: write
  models: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe a small model request and source pages without sending mail
        run: |
          python - <<'PY' > free-route-diagnostic.txt
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          payload = {
              "model": "openai/gpt-4.1",
              "messages": [{"role": "user", "content": "Reply with the word ready."}],
              "max_tokens": 20,
          }
          probes = [
              ("model", "https://models.github.ai/inference/chat/completions", payload),
              ("publisher", "https://www.nature.com/articles/s41416-026-03638-0", None),
              ("europepmc", "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:10.1038/s41416-026-03638-0&format=json", None),
          ]
          for label, url, body in probes:
              headers = {"User-Agent": "PaperReading smoke test/1.0"}
              if body is not None:
                  headers.update({
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
              request = Request(url, headers=headers,
                                data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read(300)
                      print(label, "HTTP", response.status,
                            "content-type", response.headers.get("Content-Type"),
                            "prefix-hex", raw[:40].hex())
              except HTTPError as exc:
                  print(label, "HTTP", exc.code)
              except (URLError, TimeoutError) as exc:
                  print(label, type(exc).__name__)
          PY
      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-route-diagnostic.txt
          git commit -m "Record free cloud route diagnostic"
          git push
