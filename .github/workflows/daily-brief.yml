name: Daily literature brief

on:
  # The daily schedule is intentionally disabled until source verification and
  # model access pass a cloud smoke test, and secure Gmail delivery is verified.
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: daily-literature-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source and report checks
        run: python -m unittest discover -s tests -v
      - name: Check briefing without email
        run: python daily_brief.py --dry-run
