name: Daily literature brief

on:
  schedule:
    # 08:00 Asia/Singapore. GitHub may start scheduled jobs a little late;
    # the script computes its 24-hour window from the actual start time.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Research and prepare the brief without emailing"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: daily-literature-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source and report checks
        run: python -m unittest discover -s tests -v
      - name: Prepare and deliver briefing
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python daily_brief.py --dry-run
          else
            python daily_brief.py
          fi
      - name: Save deduplication history after email succeeds
        if: ${{ success() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record delivered literature brief"
            git push
          fi
